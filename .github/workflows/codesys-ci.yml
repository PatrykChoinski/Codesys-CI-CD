name: CODESYS CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

env:
  # Bump these together when the installers change: CODESYS_VERSION
  # invalidates the actions/cache entries, and the asset names must match
  # exactly what was uploaded to the GitHub Release below.
  CODESYS_VERSION: "3.5.22.30"
  CODESYS_RELEASE_TAG: "Installers"
  CODESYS_DEVSYS_ASSET: "CODESYS.64.3.5.22.30.zip"
  CODESYS_RTE_ASSET: "CODESYS.Control.RTE.SL.3.5.22.30.zip"
  # Project archive is only used to "prime" the device repository (see
  # scripts/codesys_build.py) - it changes whenever the project's
  # target/device or bundled libraries do, so it's re-uploaded to this
  # release asset (never cached, unlike the installers, to avoid ever
  # priming with a stale copy) rather than committed to git (~120 MB,
  # over GitHub's 100 MB per-file limit). See README.md.
  PROJECT_ARCHIVE_RELEASE_TAG: "ProjectArchive"
  PROJECT_ARCHIVE_ASSET: "PilaJednosuportowa.projectarchive"
  # The project targets a hardware PLC (AX8) this runner doesn't have, so
  # Compile/Deploy/Test swap its Device - in memory only, the committed
  # .project keeps AX8 - for the locally installed CODESYS Control Win V3
  # x64 ("type|id|version", see retarget_device() in
  # scripts/codesys_common.py). In SP22/SoftMotion 4.x this plain device
  # is also the SoftMotion one (no separate "SoftMotion" variant exists).
  # Version must match CODESYS_VERSION. Set to "" to build for the
  # project's own device.
  CODESYS_TARGET_DEVICE: "4096|0000 0004|3.5.22.30"

jobs:
  build-deploy-test:
    # Hosted, ephemeral runner - a fresh VM per job, so no Docker/self-hosted
    # machine needed for isolation. Installers are pulled from this repo's
    # private "Installers" GitHub Release (see installers/README.md) using
    # the built-in GITHUB_TOKEN - no external hosting/secrets involved.
    #
    # Single job (not build + deploy-test as two separate jobs): the Dev
    # System install (~14 min) doesn't survive being cached (see the
    # comment below), so splitting into two jobs meant paying that cost
    # twice per run. One job installs it once; a failing "Compile
    # project" step still stops everything after it by default (same
    # fail-fast behaviour a separate build job gave), it just no longer
    # costs a second install to get there.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only the downloaded installer zip is cached, not the installed
      # directory itself - tried that, but CODESYS.exe hung indefinitely
      # (looked like an unresolvable "Select Profile" prompt) when the
      # Dev System was restored from a files-only cache instead of run
      # through its real installer. Whatever registry/profile state the
      # installer sets up, a file copy doesn't reproduce it, so the
      # ~14 min install itself still has to run every time for now.
      - name: Cache CODESYS Development System installer archive
        id: cache-devsys
        uses: actions/cache@v4
        with:
          path: installers\${{ env.CODESYS_DEVSYS_ASSET }}
          key: codesys-devsys-installer-${{ env.CODESYS_VERSION }}

      - name: Download CODESYS Development System installer archive
        if: steps.cache-devsys.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path installers | Out-Null
          gh release download "$env:CODESYS_RELEASE_TAG" --repo "${{ github.repository }}" `
            --pattern "$env:CODESYS_DEVSYS_ASSET" --dir installers --clobber

      - name: Extract CODESYS Development System installer
        id: extract-devsys
        shell: pwsh
        run: |
          $exePath = ./scripts/Expand-Installer.ps1 -ZipPath "installers\$env:CODESYS_DEVSYS_ASSET" -DestinationDir installers\devsys
          "exe_path=$exePath" >> $env:GITHUB_OUTPUT

      - name: Install CODESYS Development System
        shell: pwsh
        run: ./scripts/Install-CodesysDevSystem.ps1 -InstallerPath "${{ steps.extract-devsys.outputs.exe_path }}"

      # Downloaded fresh every run (not cached like the installer zips
      # above) - it's the one file that changes as the project evolves,
      # so caching it risks priming with a stale device/target.
      - name: Download project archive (device priming asset)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$env:PROJECT_ARCHIVE_RELEASE_TAG" --repo "${{ github.repository }}" `
            --pattern "$env:PROJECT_ARCHIVE_ASSET" --dir . --clobber

      - name: Compile project
        shell: pwsh
        env:
          # Unlocks the encrypted PilaJednosuportowa.projectarchive - see
          # scripts/codesys_build.py. Never logged/echoed.
          CODESYS_PROJECT_PASSWORD: ${{ secrets.PROJECT_PASSWORD }}
        run: ./scripts/Invoke-CodesysBuild.ps1

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codesys-build-report
          path: reports/junit-build.xml
          if-no-files-found: warn

      - name: Cache CODESYS Control Win V3 installer archive
        id: cache-rte
        uses: actions/cache@v4
        with:
          path: installers\${{ env.CODESYS_RTE_ASSET }}
          key: codesys-rte-installer-${{ env.CODESYS_VERSION }}

      - name: Download CODESYS Control Win V3 installer archive
        if: steps.cache-rte.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path installers | Out-Null
          gh release download "$env:CODESYS_RELEASE_TAG" --repo "${{ github.repository }}" `
            --pattern "$env:CODESYS_RTE_ASSET" --dir installers --clobber

      - name: Extract CODESYS Control Win V3 installer
        id: extract-rte
        shell: pwsh
        run: |
          $exePath = ./scripts/Expand-Installer.ps1 -ZipPath "installers\$env:CODESYS_RTE_ASSET" -DestinationDir installers\rte
          "exe_path=$exePath" >> $env:GITHUB_OUTPUT

      - name: Deploy application to runtime (login, download, start)
        shell: pwsh
        env:
          CODESYS_PROJECT_PASSWORD: ${{ secrets.PROJECT_PASSWORD }}
        run: ./scripts/Invoke-CodesysDeploy.ps1 -RteInstallerPath "${{ steps.extract-rte.outputs.exe_path }}"

      - name: Upload deploy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codesys-deploy-report
          path: reports/junit-deploy.xml
          if-no-files-found: warn

      - name: Run smoke test
        shell: pwsh
        env:
          CODESYS_PROJECT_PASSWORD: ${{ secrets.PROJECT_PASSWORD }}
        run: ./scripts/Invoke-CodesysTest.ps1

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codesys-test-report
          path: |
            reports/junit-test.xml
            reports/codesys-rte.log
          if-no-files-found: warn

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: CODESYS smoke test
          path: reports/junit-test.xml
          reporter: java-junit
          fail-on-error: true

      # Consolidated Markdown report (build+deploy+test in one place,
      # with full compile/login/runtime error text) written to the Job
      # Summary - visible right on the run page, no log digging needed.
      # Safe even if earlier stages never ran (their report just won't
      # exist yet).
      - name: Write consolidated report
        if: always()
        shell: pwsh
        run: ./scripts/Write-Summary.ps1
