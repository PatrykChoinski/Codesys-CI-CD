name: CODESYS CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

# All three jobs pin to the SAME self-hosted Windows runner (label
# "codesys-windows"). The deploy job starts the CODESYS Control Win V3
# runtime container and leaves it running; the test job assumes it is
# still there and tears it down. This only works reliably with a single
# runner behind that label - do not scale it out without redesigning the
# deploy->test handoff (e.g. passing a real reachable device address
# instead of "same machine, localhost").
jobs:
  build:
    runs-on: [self-hosted, windows, codesys-windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile project
        shell: pwsh
        run: ./scripts/Invoke-CodesysBuild.ps1

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codesys-build-report
          path: reports/junit-build.xml
          if-no-files-found: warn

  deploy:
    needs: build
    runs-on: [self-hosted, windows, codesys-windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build runtime image, start container, download+start application
        shell: pwsh
        env:
          CODESYS_RTE_INSTALLER: ${{ secrets.CODESYS_RTE_INSTALLER_FILENAME }}
        run: |
          ./scripts/Invoke-CodesysDeploy.ps1 -CodesysRteInstaller $env:CODESYS_RTE_INSTALLER

      - name: Upload deploy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codesys-deploy-report
          path: |
            reports/junit-deploy.xml
            reports/codesys-rte-deploy.log
          if-no-files-found: warn

  test:
    needs: deploy
    runs-on: [self-hosted, windows, codesys-windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke test against deployed application
        shell: pwsh
        run: ./scripts/Invoke-CodesysTest.ps1

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codesys-test-report
          path: |
            reports/junit-test.xml
            reports/codesys-rte.log
          if-no-files-found: warn

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: CODESYS smoke test
          path: reports/junit-test.xml
          reporter: java-junit
          fail-on-error: true
