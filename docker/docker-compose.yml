# Local helper for manual testing of the runtime image.
# Requires Docker Desktop in "Windows containers" mode.
#
# Usage:
#   $env:CODESYS_RTE_INSTALLER = "CODESYSControlWinV3x64Setup.exe"
#   docker compose -f docker/docker-compose.yml build
#   docker compose -f docker/docker-compose.yml up -d
services:
  codesys-rte:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CODESYS_RTE_INSTALLER: ${CODESYS_RTE_INSTALLER}
    image: codesys-rte-win:3.5.22
    container_name: codesys-rte
    platform: windows
    ports:
      - "1217:1217"
      - "4840:4840"
      - "8080:8080"
